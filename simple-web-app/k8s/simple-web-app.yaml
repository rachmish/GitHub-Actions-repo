apiVersion: v1
kind: Namespace
metadata:
  name: simple-web-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-web-app
  namespace: simple-web-app
  labels:
    app: simple-web-app
spec:
  # Tasks are stored in memory per pod; keep 1 replica unless external storage is added.
  replicas: 1
  selector:
    matchLabels:
      app: simple-web-app
  template:
    metadata:
      labels:
        app: simple-web-app
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: simple-web-app
        # Replace with your pushed image, for example <account>.dkr.ecr.<region>.amazonaws.com/simple-web-app:1.0.0
        image: simple-web-app:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: APP_NAME
          value: "Simple Task App"
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: simple-web-app
  namespace: simple-web-app
  labels:
    app: simple-web-app
spec:
  type: ClusterIP
  selector:
    app: simple-web-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: http
